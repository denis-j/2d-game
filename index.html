<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knight's Descent: Escape from the Depths</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #1a1a2e;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      #game-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      canvas {
        background: #16213e;
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      #info {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #e94560;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px 20px;
        border-radius: 5px;
      }

      h1 {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #0ea5e9;
        margin: 0;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px 20px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <h1>Knight's Descent: Escape from the Depths</h1>
      <div id="info">
        Steuerung: Pfeiltasten oder WASD zum Bewegen | Leertaste zum Angreifen
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
